name: Attestation invariants

# These checks guard properties whose silent loss would break nothing visible:
# the archival/live separation, the no-downgrade rule, the root pin, and the
# refusal to sign an archived proof for on-chain submission. CodeQL will not
# catch any of them — they are semantic, not structural.

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'tests/**'
      - 'verify.py'
      - 'attestation.py'
      - 'attestations/**'
      - '.github/workflows/attestor-tests.yml'
  pull_request:
    branches: [main]
  # Monthly, so a change on Google's side surfaces here rather than in an
  # auditor's terminal. The published bundle must stay verifiable indefinitely.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    name: Verify the published attestation bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install attestor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bridge/requirements-attestor.txt

      # TEMPORARILY SUSPENDED — v1.18 metered settlement.
      # TODO: Re-enable once bundle-pki-v5.json is generated via enclave run
      #
      # Both steps below depend on attestations/bundle-pki-v4.json, produced before
      # consumed_sec entered the binding-nonce preimage. The protocol is v2-only by
      # decision (2026-08-06): no legacy dispatch, no optional-argument path. That
      # makes the v4 bundle structurally unverifiable, not merely failing —
      # compute_binding_nonce now hashes 168 bytes and v4 committed to 160.
      #
      # The fixture CANNOT be repaired by hand: its binding_nonce is committed by the
      # eat_nonce inside a Google-signed token. Adding consumed_sec to the JSON would
      # make the file inconsistent with its own signature.
      #
      # TO RE-ENABLE: run the enclave against the current attestation.py, commit the
      # resulting bundle as attestations/bundle-pki-v5.json, point both steps at it,
      # and delete the `if: false` lines. The same run also unblocks
      # test_CrossLanguage_PublishedBundleNonce in neurolix-contracts.

      - name: Warn that the attestation invariants are not running
        run: |
          echo "::warning::attestor invariants SUSPENDED pending bundle-pki-v5.json."
          echo "::warning::A green run here proves NOTHING about the attestor right now."

      # The standalone verifier is what a third party actually runs. If it
      # breaks, nobody on the team notices — they all use the attestor.
      - name: Verify the published bundle with the standalone verifier
        if: false
        run: python3 verify.py attestations/bundle-pki-v4.json

      - name: Check the attestor security invariants
        if: false
        run: python3 tests/test_attestor_invariants.py